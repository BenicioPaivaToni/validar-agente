<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat GPTMaker</title>
    <style>
        /* Reset básico para ocupar a tela toda */
        * {
            margin: 4;
            padding: 4;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Container principal com duas colunas */
        .container {
            display: flex;
            height: 100vh;           /* ocupa 100% da altura da janela */
            width: 100vw;            /* ocupa 100% da largura */
        }

        /* Coluna da esquerda (pode ser usada para texto, logo, etc.) */
        .left {
            flex: 1;                 /* ocupa o espaço disponível */
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .left h1 {
            font-size: 2.5rem;
            color: #333;
        }

        .left p {
            font-size: 1.2rem;
            color: #666;
            margin-top: 20px;
        }

        /* Coluna da direita (onde fica o iframe) */
        .right {
            flex: 1;                 /* mesma proporção da esquerda */
            background: #ffffff;
            display: flex;
            align-items: stretch;    /* garante que o iframe estique */
        }

        .right iframe {
            width: 100%;
            height: 100%;
            min-height: 500px;       /* como você pediu */
            border: none;
            display: block;
        }

        /* Opcional: em telas pequenas, o iframe ocupa a tela inteira */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left {
                padding: 20px;
                min-height: 150px;
            }
            .right {
                flex: 2;             /* dá mais espaço para o iframe */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Coluna esquerda -->
        <div class="left">
            <h1>🤖 Assistente</h1>
            <p>Converse com a IA no painel ao lado.</p>
        </div>

        <!-- Coluna direita com o iframe -->
        <div class="right">
            <iframe 
                src="https://app.gptmaker.ai/widget/3F7980197E656307C89E5E219A3CFEDA/iframe"
                allow="microphone;"
                frameborder="0">
            </iframe>
        </div>
    </div>
</body>
</html>
